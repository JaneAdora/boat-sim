<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boat Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; }
    canvas { display: block; }

    #hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      align-items: center;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
    }

    .hud-value {
      font-size: 18px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
    }

    #compass-container {
      width: 48px;
      height: 48px;
    }

    #compass-container svg {
      width: 100%;
      height: 100%;
    }

    #wind-arrow {
      transition: transform 0.3s ease;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1628;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen h1 {
      font-size: 36px;
      font-weight: 300;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }

    #loading-bar-container {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: #5b9bd5;
      transition: width 0.3s ease;
    }

    #loading-text {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.5;
    }

    #controls-help {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #controls-help.visible {
      opacity: 1;
    }

    #controls-help table {
      border-collapse: collapse;
    }

    #controls-help td {
      padding: 2px 12px;
    }

    #controls-help td:first-child {
      font-weight: 600;
      text-align: right;
      opacity: 0.7;
    }

    /* Boat selector */
    #boat-selector {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .boat-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      min-width: 120px;
    }

    .boat-card:hover, .boat-card:active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-2px);
    }

    .boat-icon { font-size: 32px; }
    .boat-name { font-size: 14px; font-weight: 500; letter-spacing: 0.5px; }
    .boat-desc { font-size: 11px; opacity: 0.5; }

    /* Mobile HUD toggle */
    #hud-toggle {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      cursor: pointer;
      z-index: 20;
      padding: 0;
      line-height: 36px;
      text-align: center;
    }

    /* Minimap */
    #minimap-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 10;
      pointer-events: none;
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
    }

    #map-toggle {
      display: none;
      position: fixed;
      top: 16px;
      right: 56px;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      cursor: pointer;
      z-index: 20;
      padding: 0;
      line-height: 36px;
      text-align: center;
    }

    #tow-button {
      position: fixed;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      z-index: 60;
      pointer-events: none;
      transition: opacity 0.3s ease, background 0.2s;
      opacity: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #tow-button.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #tow-button.towing {
      background: rgba(200, 80, 50, 0.3);
      border-color: rgba(200, 80, 50, 0.25);
    }

    /* Mobile: move HUD above touch controls, hide keyboard help */
    @media (pointer: coarse) {
      #hud {
        bottom: auto;
        top: 16px;
        left: 16px;
        transform: none;
        font-size: 12px;
        gap: 16px;
        padding: 8px 16px;
      }
      #controls-help {
        display: none !important;
      }
      #hud-toggle {
        display: block;
      }
      #minimap-container {
        bottom: auto;
        top: 60px;
        right: 16px;
        width: 100px;
        height: 100px;
        display: none;
      }
      #map-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>BOAT SIMULATOR</h1>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Loading...</div>
  </div>

  <div id="hud">
    <div class="hud-item" id="compass-container">
      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="24" y="10" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7" font-family="sans-serif">N</text>
        <g id="compass-needle" transform="rotate(0, 24, 24)">
          <line x1="24" y1="14" x2="24" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <polygon points="24,14 21,22 27,22" fill="#e05050"/>
          <polygon points="24,34 21,26 27,26" fill="rgba(255,255,255,0.4)"/>
        </g>
      </svg>
    </div>
    <div class="hud-item">
      <span class="hud-label">Speed</span>
      <span class="hud-value" id="speed-value">0.0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Wind</span>
      <span class="hud-value">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <g id="wind-arrow" transform="rotate(0, 12, 12)">
            <line x1="12" y1="20" x2="12" y2="4" stroke="#5b9bd5" stroke-width="2"/>
            <polygon points="12,2 8,8 16,8" fill="#5b9bd5"/>
          </g>
        </svg>
      </span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Throttle</span>
      <span class="hud-value" id="sail-value">0%</span>
    </div>
  </div>

  <button id="hud-toggle" aria-label="Toggle gauges"></button>

  <div id="controls-help">
    <table>
      <tr><td>W/S</td><td>Throttle</td></tr>
      <tr><td>A/D</td><td>Rudder</td></tr>
      <tr><td>Q/E</td><td>Camera orbit</td></tr>
      <tr><td>R/F</td><td>Zoom</td></tr>
      <tr><td>Right-drag</td><td>Look around</td></tr>
      <tr><td>Scroll</td><td>Zoom</td></tr>
      <tr><td>M</td><td>Mute audio</td></tr>
      <tr><td>H</td><td>Toggle HUD</td></tr>
      <tr><td>N</td><td>Toggle map</td></tr>
      <tr><td>T</td><td>Tow / Release</td></tr>
    </table>
  </div>

  <div id="minimap-container">
    <canvas id="minimap-canvas" width="280" height="280"></canvas>
  </div>
  <button id="map-toggle" aria-label="Toggle map"></button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
